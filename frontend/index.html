          <h2>Tentang PIK-R MANSEKU</h2>
          <p>PIK-R MANSEKU (Pusat Informasi dan Konseling Remaja MAN 1 Muara Enim) adalah wadah konseling sebaya yang aman dan bersahabat bagi remaja. Kami mengedukasi tentang kesehatan reproduksi, life skills, pengembangan diri, dan program GenRe (Generasi Berencana).</p>
          <p>Berlokasi di MAN 1 Muara Enim, Jl. K.H. Ahmad Dahlan, Pasar III, Muara Enim, Sumatera Selatan 31311.</p>
        </section>

          <p>Daftarkan dirimu secara online untuk menjadi anggota atau konselor sebaya generasi penerus di MAN 1 Muara Enim melalui formulir pendaftaran berbasis NISN di <a href="/daftar">Halaman Pendaftaran PIK-R</a>.</p>
        </section>

          <h2>Ruang Cerita PIK-R</h2>
